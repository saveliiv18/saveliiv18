<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 220"
  width="1200"
  height="220"
>
  <style>
    .bg {
      fill: #0D1117;
    }

    .letter {
      fill: #ffffff;
      font-family: monospace;
      font-size: 54px;
      font-weight: 700;
      text-anchor: middle;
      opacity: 0;
      animation: converge 4s ease-in-out infinite;
    }

    @keyframes converge {
      0% {
        opacity: 0;
        transform: translate(var(--x), var(--y))
                   rotate(var(--r))
                   scale(0.7);
      }

      20% {
        opacity: 1;
      }

      50%, 80% {
        opacity: 1;
        transform: translate(0, 0)
                   rotate(0deg)
                   scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(0, 0)
                   rotate(0deg)
                   scale(1);
      }
    }
  </style>

  <rect class="bg" width="100%" height="100%" rx="16"/>

  <g>
    <text class="letter" x="285" y="125"
          style="--x:-260px; --y:70px; --r:-35deg;">A</text>

    <text class="letter" x="335" y="125"
          style="--x:-220px; --y:-80px; --r:30deg;">I</text>

    <text class="letter" x="410" y="125"
          style="--x:-160px; --y:100px; --r:-25deg;">•</text>

    <text class="letter" x="485" y="125"
          style="--x:-120px; --y:-90px; --r:20deg;">M</text>

    <text class="letter" x="535" y="125"
          style="--x:-80px; --y:80px; --r:-15deg;">L</text>

    <text class="letter" x="610" y="125"
          style="--x:0px; --y:-110px; --r:25deg;">•</text>

    <text class="letter" x="685" y="125"
          style="--x:80px; --y:90px; --r:-20deg;">Q</text>

    <text class="letter" x="735" y="125"
          style="--x:120px; --y:-80px; --r:20deg;">U</text>

    <text class="letter" x="785" y="125"
          style="--x:160px; --y:100px; --r:-25deg;">A</text>

    <text class="letter" x="835" y="125"
          style="--x:210px; --y:-90px; --r:30deg;">N</text>

    <text class="letter" x="885" y="125"
          style="--x:260px; --y:70px; --r:35deg;">T</text>
  </g>
</svg>
