<svg width="900" height="260" viewBox="0 0 900 260"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="260" rx="12"
        fill="#0D1117"
        stroke="#30363D"/>

  <!-- Grid -->
  <g stroke="#21262D" stroke-width="1" opacity="0.55">
    <path d="M40 40H860 M40 80H860 M40 120H860 M40 160H860 M40 200H860"/>
    <path d="M100 25V220 M180 25V220 M260 25V220 M340 25V220
             M420 25V220 M500 25V220 M580 25V220 M660 25V220
             M740 25V220 M820 25V220"/>
  </g>

  <!-- Quant curve -->
  <path
    d="M40 180
       C80 175 100 145 135 155
       S190 120 225 135
       S280 90 315 105
       S370 130 405 100
       S455 65 490 85
       S545 125 580 90
       S630 50 670 70
       S720 105 755 75
       S810 45 860 55"
    fill="none"
    stroke="#8B949E"
    stroke-width="2"
    stroke-dasharray="900"
    stroke-dashoffset="900">

    <animate
      attributeName="stroke-dashoffset"
      from="900"
      to="0"
      dur="4s"
      repeatCount="indefinite"/>
  </path>

  <!-- Moving market / signal point -->
  <circle r="5" fill="#FFFFFF">
    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      path="M40 180
            C80 175 100 145 135 155
            S190 120 225 135
            S280 90 315 105
            S370 130 405 100
            S455 65 490 85
            S545 125 580 90
            S630 50 670 70
            S720 105 755 75
            S810 45 860 55"/>
  </circle>

  <!-- Neural network -->
  <g stroke="#484F58" stroke-width="1">
    <line x1="110" y1="70" x2="190" y2="60"/>
    <line x1="110" y1="70" x2="190" y2="110"/>
    <line x1="110" y1="120" x2="190" y2="60"/>
    <line x1="110" y1="120" x2="190" y2="110"/>
    <line x1="110" y1="120" x2="190" y2="160"/>
    <line x1="110" y1="170" x2="190" y2="110"/>
    <line x1="110" y1="170" x2="190" y2="160"/>

    <line x1="190" y1="60" x2="270" y2="90"/>
    <line x1="190" y1="60" x2="270" y2="140"/>
    <line x1="190" y1="110" x2="270" y2="90"/>
    <line x1="190" y1="110" x2="270" y2="140"/>
    <line x1="190" y1="160" x2="270" y2="90"/>
    <line x1="190" y1="160" x2="270" y2="140"/>

    <line x1="270" y1="90" x2="350" y2="115"/>
    <line x1="270" y1="140" x2="350" y2="115"/>
  </g>

  <!-- Nodes -->
  <g fill="#0D1117" stroke="#C9D1D9" stroke-width="2">
    <circle cx="110" cy="70" r="7"/>
    <circle cx="110" cy="120" r="7"/>
    <circle cx="110" cy="170" r="7"/>

    <circle cx="190" cy="60" r="7"/>
    <circle cx="190" cy="110" r="7"/>
    <circle cx="190" cy="160" r="7"/>

    <circle cx="270" cy="90" r="7"/>
    <circle cx="270" cy="140" r="7"/>

    <circle cx="350" cy="115" r="8"/>
  </g>

  <!-- Pulsing ML nodes -->
  <circle cx="190" cy="110" r="7" fill="#FFFFFF">
    <animate
      attributeName="opacity"
      values="0.15;1;0.15"
      dur="1.8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="270" cy="90" r="7" fill="#FFFFFF">
    <animate
      attributeName="opacity"
      values="0.15;1;0.15"
      dur="1.8s"
      begin="0.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="350" cy="115" r="8" fill="#FFFFFF">
    <animate
      attributeName="opacity"
      values="0.15;1;0.15"
      dur="1.8s"
      begin="1s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Labels -->
  <g
    fill="#C9D1D9"
    font-family="monospace"
    font-size="13">

    <text x="55" y="238">
      INPUT
    </text>

    <text x="170" y="238">
      HIDDEN
    </text>

    <text x="315" y="238">
      OUTPUT
    </text>

    <text x="560" y="238">
      ML SIGNAL / QUANT MODEL
    </text>

  </g>

</svg>
